name: Build FormantSlide VST3 (Windows)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure JUCE and project
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build VST3
        shell: pwsh
        run: cmake --build build --config Release --target FormantSlide_VST3 --parallel 2
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: FormantSlide-Windows-VST3
          path: build/FormantSlide_artefacts/Release/VST3/*.vst3/**
          if-no-files-found: error

name: Build FormantSlide FL Native (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout source and SDK
        uses: actions/checkout@v4

      - name: Verify SDK is present
        shell: pwsh
        run: |
          if (-not (Test-Path 'SDK/fp_plugclass.h')) {
            throw 'SDK folder missing. Copy SDK/ from the FL Studio SDK template ZIP into the repository root.'
          }

      - name: Configure Windows native plugin
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build FormantSlide native DLL
        shell: pwsh
        run: cmake --build build --config Release --target FormantSlideNative --parallel 2

      - name: Verify DLL exists
        shell: pwsh
        run: |
          if (-not (Test-Path 'build/Release/FormantSlide_x64.dll')) {
            throw 'FormantSlide_x64.dll was not produced at the expected location.'
          }

      - name: Upload native plugin
        uses: actions/upload-artifact@v4
        with:
          name: FormantSlide-FL-Native-Windows
          path: build/Release/FormantSlide_x64.dll
          if-no-files-found: error

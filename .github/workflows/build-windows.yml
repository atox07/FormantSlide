name: Build FormantSlide FL Native (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout plugin source only
        uses: actions/checkout@v4

      - name: Prepare FL Studio SDK on GitHub runner
        shell: pwsh
        env:
          FL_SDK_ZIP_URL: ${{ secrets.FL_SDK_ZIP_URL }}
        run: |
          $sdkPath = Join-Path $env:GITHUB_WORKSPACE 'SDK'
          if (-not (Test-Path -LiteralPath (Join-Path $sdkPath 'fp_plugclass.h'))) {
            if (-not $env:FL_SDK_ZIP_URL) {
              throw 'SDK not found in checkout. Set repository secret FL_SDK_ZIP_URL to a private HTTPS ZIP containing your SDK folder (including its CMakeLists.txt). No self-hosted runner is needed.'
            }
            $sdkUri = $null
            if (-not [Uri]::TryCreate($env:FL_SDK_ZIP_URL, [UriKind]::Absolute, [ref]$sdkUri) -or $sdkUri.Scheme -ne 'https') {
              throw 'FL_SDK_ZIP_URL must be an HTTPS URL.'
            }
            $sdkArchive = Join-Path $env:RUNNER_TEMP 'formantslide-sdk.zip'
            $sdkExtract = Join-Path $env:RUNNER_TEMP ('formantslide-sdk-' + [Guid]::NewGuid().ToString('N'))
            try {
              Invoke-WebRequest -Uri $sdkUri -OutFile $sdkArchive -ErrorAction Stop
              Expand-Archive -LiteralPath $sdkArchive -DestinationPath $sdkExtract -ErrorAction Stop
            } catch {
              throw 'Unable to download/extract private SDK archive. Check the FL_SDK_ZIP_URL secret and ZIP availability.'
            }
            $sdkHeaders = @(Get-ChildItem -LiteralPath $sdkExtract -Filter 'fp_plugclass.h' -Recurse -File)
            $sdkFolders = @($sdkHeaders | Where-Object { Test-Path -LiteralPath (Join-Path $_.DirectoryName 'CMakeLists.txt') })
            if ($sdkFolders.Count -ne 1) {
              throw 'SDK ZIP must contain exactly one SDK directory with fp_plugclass.h and CMakeLists.txt together.'
            }
            $sdkPath = $sdkFolders[0].DirectoryName
          }
          if (-not (Test-Path -LiteralPath (Join-Path $sdkPath 'CMakeLists.txt'))) {
            throw 'SDK/CMakeLists.txt is missing.'
          }
          "FL_SDK_DIR=$sdkPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure Windows native plugin
        shell: pwsh
        run: cmake --fresh -S . -B build -G "Visual Studio 17 2022" -A x64 "-DFL_SDK_DIR=$env:FL_SDK_DIR"

      - name: Build FormantSlide native DLL
        shell: pwsh
        run: cmake --build build --config Release --target FormantSlideNative --parallel 2

      - name: Verify distribution files
        shell: pwsh
        run: |
          foreach ($file in @('build/Release/FormantSlide_x64.dll', 'build/Release/THIRD_PARTY_LICENSES.txt')) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing distribution file: $file" }
          }

      - name: Upload native plugin and notices
        uses: actions/upload-artifact@v4
        with:
          name: FormantSlide-FL-Native-Windows
          path: |
            build/Release/FormantSlide_x64.dll
            build/Release/THIRD_PARTY_LICENSES.txt
          if-no-files-found: error
